name: Device check

# Runs the app's on-device check on an Android emulator and publishes the
# report and screenshots as the "device-check" release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build app and on-device check
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash ci/device-check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-check
          path: out/

      - name: Publish report and screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete device-check --yes --cleanup-tag || true
          gh release create device-check out/* \
            --prerelease \
            --title "Device check (emulator)" \
            --notes "On-device check of commit ${GITHUB_SHA::7}: report.txt, summary.txt and screenshots."
